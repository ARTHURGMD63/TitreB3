# Intégration continue : qualité du code, tests (unitaires, intégration, sécurité), audit des dépendances, build Docker.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  qualite:
    name: Lint et audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Audit de sécurité des dépendances de production
        run: npm run audit

  tests:
    name: Tests (unitaires, intégration, sécurité)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://resa_app:resa_app_ci@localhost:5432/reservation
      DATABASE_ADMIN_URL: postgres://postgres:postgres_ci@localhost:5432/reservation
      APP_DB_PASSWORD: resa_app_ci
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: secret-ci-uniquement-pour-les-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm run test:unit
      - name: Tests d'intégration
        run: npm run test:integration
      - name: Tests de sécurité
        run: npm run test:security

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t reservation-app:ci .
      - name: Analyse de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: reservation-app:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
